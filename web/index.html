<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Awaken2D editor</title>
    <link rel="stylesheet" href="/web/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <span class="brand" translate="no">Awaken<b>2D</b></span>
      <details class="menu" id="menu-file">
        <summary>File</summary>
        <div class="menu-body">
          <button id="m-open">Open…<kbd>Ctrl+O</kbd></button>
          <hr />
          <button id="m-spine-import">Import Spine…</button>
          <button id="m-spine-export" class="spine-only">Export to Spine…</button>
          <button id="m-live2d-import">Import Live2D…</button>
          <button id="m-live2d-export" class="live2d-only">Export to Live2D…</button>
          <hr />
          <button id="m-save">Save<kbd>Ctrl+S</kbd></button>
          <button id="m-save-as">Save As…<kbd>Ctrl+Shift+S</kbd></button>
          <button id="m-revert">Revert to Saved</button>
          <hr />
          <label><input type="checkbox" id="m-autosave" /> Auto-save every edit</label>
        </div>
      </details>
      <details class="menu" id="menu-edit">
        <summary>Edit</summary>
        <div class="menu-body">
          <button id="m-undo">Undo<kbd>Ctrl+Z</kbd></button>
          <button id="m-redo">Redo<kbd>Ctrl+Shift+Z</kbd></button>
          <hr />
          <button id="m-rename">Rename Selected<kbd>F2</kbd></button>
          <button id="m-delete">Delete Selected…<kbd>Shift+Del</kbd></button>
          <hr />
          <button id="m-select-none">Deselect<kbd>Esc</kbd></button>
        </div>
      </details>
      <details class="menu">
        <summary title="Viewport overlays and evaluation">View</summary>
        <div class="menu-body">
          <div class="menu-label">Overlays</div>
          <label class="spine-only"><input type="checkbox" id="ov-bones" checked /> Bones</label>
          <label class="spine-only"><input type="checkbox" id="ov-names" /> Bone names</label>
          <label><input type="checkbox" id="ov-mesh" /> Mesh wireframe</label>
          <label class="live2d-only"><input type="checkbox" id="ov-l2d-deformers" /> Deformers</label>
          <label class="live2d-only"><input type="checkbox" id="ov-l2d-glue" /> Glue</label>
          <div class="menu-label">Evaluate</div>
          <label class="spine-only"><input type="checkbox" id="ov-ik" checked /> IK constraints</label>
          <label><input type="checkbox" id="ov-physics" checked /> Physics</label>
          <hr />
          <button id="m-fit">Fit View<kbd>F</kbd></button>
        </div>
      </details>
      <details class="menu">
        <summary>Help</summary>
        <div class="menu-body">
          <button id="m-shortcuts">Keyboard Shortcuts<kbd>?</kbd></button>
          <button id="m-about">About Awaken2D</button>
        </div>
      </details>
      <div class="sep"></div>
      <span id="target" class="target-badge" hidden></span>
      <button id="file" class="file-btn" title="Open another model (Ctrl+O)"><span id="file-name">No model</span><span id="dirty" class="dirty" title="Unsaved changes" hidden>●</span><span class="caret">▾</span></button>
      <button id="save" class="save" title="Save (Ctrl+S)" disabled>Save</button>
      <div class="sep"></div>
      <div class="group">
        <button id="undo" class="icon" title="Undo (Ctrl+Z)" disabled>↶</button>
        <button id="redo" class="icon" title="Redo (Ctrl+Shift+Z)" disabled>↷</button>
      </div>
      <div class="sep"></div>
      <div class="segmented" id="modes">
        <button data-mode="pose" class="active" title="Pose / animate (1)">Pose</button>
        <button data-mode="mesh" title="Edit mesh vertices (2)">Mesh</button>
        <button data-mode="weights" class="spine-only" title="Paint weights (3)">Weights</button>
      </div>
      <span class="spacer"></span>
      <span id="live" class="live" title="Connected: picks up changes made on disk (e.g. edits from an agent)">live</span>
      <button id="issues" class="issues ok" title="Validation results">valid</button>
    </header>

    <main id="main">
      <aside class="panel left">
        <nav class="tabs" id="tabs">
          <button data-tab="bones" class="active spine-only">Bones</button>
          <button data-tab="slots">Slots</button>
          <button data-tab="params" class="live2d-only">Params</button>
          <button data-tab="constraints" class="spine-only">Constraints</button>
          <button data-tab="skins" class="spine-only">Skins</button>
          <button data-tab="events" class="spine-only">Events</button>
          <button data-tab="images" class="spine-only">Images</button>
        </nav>
        <div class="search"><input id="search" type="search" placeholder="Filter…" /></div>
        <div id="tree" class="tree"></div>
      </aside>
      <div class="resizer vertical" data-resize="left" title="Drag to resize"></div>

      <section class="viewport" id="viewport">
        <canvas id="gl"></canvas>
        <canvas id="overlay"></canvas>
        <div class="tool-palette" id="tools">
          <button data-tool="select" class="active" title="Select (Q): drag bones directly">
            <svg viewBox="0 0 20 20"><path d="M5 3l10 7-4.5 1 2.5 5-2 1-2.5-5L5 15z" /></svg>
          </button>
          <button data-tool="move" title="Move (W)">
            <svg viewBox="0 0 20 20"><path d="M10 2l3 3h-2v4h4V7l3 3-3 3v-2h-4v4h2l-3 3-3-3h2v-4H5v2l-3-3 3-3v2h4V5H7z" /></svg>
          </button>
          <button data-tool="rotate" title="Rotate (E)">
            <svg viewBox="0 0 20 20"><path d="M10 3a7 7 0 1 0 7 7h-2a5 5 0 1 1-1.5-3.5L11 9h6V3l-2.1 2.1A7 7 0 0 0 10 3z" /></svg>
          </button>
          <button data-tool="scale" title="Scale (R)">
            <svg viewBox="0 0 20 20"><path d="M3 3h6v2H6.4l3.3 3.3-1.4 1.4L5 6.4V9H3zm14 14h-6v-2h2.6l-3.3-3.3 1.4-1.4 3.3 3.3V11h2z" /></svg>
          </button>
          <div class="tp-sep"></div>
          <button data-tool="bone" class="spine-only" title="New bone (B): drag from joint to tip">
            <svg viewBox="0 0 20 20"><path d="M4 16l9-9" stroke-width="3" stroke="currentColor" stroke-linecap="round" fill="none" /><circle cx="4" cy="16" r="2.5" /><path d="M15 2v3h3v2h-3v3h-2V7h-3V5h3V2z" /></svg>
          </button>
          <div class="tp-sep spine-only compensate"></div>
          <button id="comp-bones" class="toggle spine-only compensate" title="Bone compensation (Shift+T)">
            <svg viewBox="0 0 20 20"><path d="M3 15l7-7" stroke-width="2.6" stroke="currentColor" stroke-linecap="round" fill="none" /><circle cx="3" cy="15" r="2" /><path d="M11 9l5-5" stroke-width="1.6" stroke="currentColor" stroke-linecap="round" stroke-dasharray="1.5 1.8" fill="none" /><path d="M13.5 12.5h4v5h-4zM14.3 12.5v-1.2a1.2 1.2 0 0 1 2.4 0v1.2" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
          <button id="comp-images" class="toggle spine-only compensate" title="Image compensation (T)">
            <svg viewBox="0 0 20 20"><path d="M2 3h11v9H2z" fill="none" stroke="currentColor" stroke-width="1.4" /><path d="M3.5 10.5l3-3.5 2.2 2.4 1.6-1.6 1.8 2.7z" /><circle cx="10" cy="5.8" r="1.1" /><path d="M13.5 12.5h4v5h-4zM14.3 12.5v-1.2a1.2 1.2 0 0 1 2.4 0v1.2" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
        </div>
        <div class="banner" id="banner" hidden>
          <span>This file was changed on disk (maybe by an agent) while you have unsaved edits.</span>
          <button id="use-disk">Load disk version</button>
          <button id="keep-mine" class="primary">Keep my edits</button>
        </div>
        <div class="vp-tools">
          <div class="l2d-show live2d-only" id="l2d-view">
            <button data-view="lock" title="Lock drawable objects (Shift+A): art meshes, deformation paths and art paths are not picked in the viewport">
              <svg viewBox="0 0 20 20"><g stroke="#4ea1ff" stroke-width="1.3" fill="none"><rect x="1.5" y="1.5" width="9" height="9" /><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" /></g><path d="M9 12c1.2-2.4 2.4-2.8 3.6-4.8s1.2-3.2 2.4-4" stroke="#e0a43a" stroke-width="2.4" stroke-linecap="round" fill="none" /><path d="M1.5 17.5c2-3.2 4-0.8 5.6-4s2.4-3.2 4-3.6" stroke="#26b5b5" stroke-width="1.2" fill="none" /><g fill="#26b5b5"><circle cx="1.8" cy="17.3" r="1.3" /><circle cx="7.2" cy="13.4" r="1.3" /></g><g><path d="M13.6 13v-2a2.4 2.4 0 0 1 4.8 0v2" fill="none" stroke="#e8d44d" stroke-width="1.5" /><rect x="12.4" y="12.6" width="7.2" height="6" rx="1" fill="#e8d44d" /></g></svg>
            </button>
            <button data-view="deflock" title="Lock deformers (Shift+D): warp and rotation deformers are not picked or edited in the viewport">
              <svg viewBox="0 0 20 20"><g fill="#3fb96c"><rect x="1.5" y="1.5" width="4" height="4" rx="0.8" /><rect x="6.5" y="1.5" width="4" height="4" rx="0.8" /><rect x="1.5" y="6.5" width="4" height="4" rx="0.8" /><rect x="6.5" y="6.5" width="4" height="4" rx="0.8" /></g><g fill="none" stroke="#e5534b" stroke-width="1.6"><circle cx="7" cy="14.5" r="3.6" /><path d="M7 14.5V8.8M5.6 10.2L7 8.8l1.4 1.4" /></g><g><path d="M13.6 13v-2a2.4 2.4 0 0 1 4.8 0v2" fill="none" stroke="#e8d44d" stroke-width="1.5" /><rect x="12.4" y="12.6" width="7.2" height="6" rx="1" fill="#e8d44d" /></g></svg>
            </button>
            <span class="sep"></span>
            <button data-view="drawables" title="Show / hide drawable objects: art meshes, deformation paths and art paths">
              <svg viewBox="0 0 20 20"><g stroke="#4ea1ff" stroke-width="1.3" fill="none"><rect x="1.5" y="1.5" width="9" height="9" /><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" /></g><path d="M9 12c1.2-2.4 2.4-2.8 3.6-4.8s1.2-3.2 2.4-4" stroke="#e0a43a" stroke-width="2.4" stroke-linecap="round" fill="none" /><path d="M1.5 17.5c2-3.2 4-0.8 5.6-4s2.4-3.2 4-3.6" stroke="#26b5b5" stroke-width="1.2" fill="none" /><g fill="#26b5b5"><circle cx="1.8" cy="17.3" r="1.3" /><circle cx="7.2" cy="13.4" r="1.3" /></g><g><path d="M11.2 15.5c1.6-2.6 3.3-3.6 4.8-3.6s3.2 1 4.8 3.6c-1.6 2.6-3.3 3.6-4.8 3.6s-3.2-1-4.8-3.6z" fill="#17191d" stroke="#e6e8eb" stroke-width="1.2" /><circle cx="16" cy="15.5" r="1.6" fill="#e6e8eb" /></g></svg>
            </button>
          </div>
          <span id="zoom" class="chip" translate="no">100%</span>
          <button id="fit" title="Fit view (F)">Fit</button>
        </div>
        <div class="hint" id="hint">Drag a bone to rotate, drag its joint to move, drag empty space to pan, wheel to zoom.</div>
      </section>

      <div class="resizer vertical" data-resize="right" title="Drag to resize"></div>
      <aside class="panel right">
        <div id="props" class="props"></div>
        <div id="issue-list" class="issue-list" hidden></div>
      </aside>
    </main>

    <div class="resizer horizontal" data-resize="timeline" title="Drag to resize"></div>
    <section class="timeline">
      <div class="tl-bar">
        <select id="anim" title="Animation (Setup = edit the rest pose)"></select>
        <div class="group">
          <button id="new-anim" class="icon" title="New animation">＋</button>
          <button id="dup-anim" class="icon" title="Duplicate animation">⧉</button>
          <button id="rename-anim" class="icon" title="Rename animation">✎</button>
          <button id="del-anim" class="icon" title="Delete animation">🗑</button>
        </div>
        <label class="inline" title="Duration in seconds">len <input id="duration" type="number" step="0.1" min="0.01" /></label>
        <label class="inline" title="Loop"><input id="loop" type="checkbox" /> loop</label>
        <div class="sep"></div>
        <div class="group transport">
          <button id="to-start" class="icon" title="First frame (Home)">⏮</button>
          <button id="prev-frame" class="icon" title="Previous frame (←)">◀</button>
          <button id="play" class="play" title="Play / pause (Space)">▶</button>
          <button id="next-frame" class="icon" title="Next frame (→)">▶</button>
          <button id="to-end" class="icon" title="Last frame (End)">⏭</button>
        </div>
        <span id="time" class="time">setup pose</span>
        <select id="speed" title="Playback speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
        <button id="mute" class="icon" title="Event sounds on / off (audio of events with a sound, while playing)" hidden>🔊</button>
        <div class="sep"></div>
        <select id="fps" title="Frame grid">
          <option value="24">24 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="60">60 fps</option>
        </select>
        <label class="inline" title="Snap keys and playhead to frames"><input id="snap" type="checkbox" checked /> snap</label>
        <label class="inline" title="Show every bone and parameter, not just animated ones"><input id="all-tracks" type="checkbox" /> all tracks</label>
        <span class="spacer"></span>
        <button id="key" title="Key the selected bone at the playhead (K)">◆ Key</button>
        <button id="tl-fit" title="Fit the animation in the timeline">Fit</button>
      </div>
      <div class="tl-body">
        <canvas id="tl-canvas"></canvas>
        <aside id="tl-inspector" class="tl-inspector"></aside>
      </div>
    </section>

    <footer class="statusbar">
      <span id="status" class="status"></span>
      <span class="spacer"></span>
      <span id="cursor" class="dim" translate="no"></span>
      <span id="fps-meter" class="dim" translate="no"></span>
    </footer>

    <script type="module" src="/web/app.ts"></script>
  </body>
</html>
